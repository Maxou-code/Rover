[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino

; upload_port = COM11

monitor_speed = 115200

board_build.partitions = partitions/esp32cam_ota.csv

; Décommente pour OTA
; upload_protocol = espota
; upload_port = 192.168.4.1
; upload_flags = --auth=123456

lib_extra_dirs = C:/Users/Eleve/Documents/Arduino/libraries
